<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>P2P Chat (WebRTC)</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 20px auto; }
    #log { border: 1px solid #aaa; height: 250px; overflow-y: auto; padding: 5px; }
    input { padding: 6px; }
    button { padding: 6px 12px; }
  </style>
</head>
<body>

<h2>P2P WebRTC Chat</h2>
<div id="log"></div>

<input id="msg" placeholder="Type message..." style="width:80%">
<button id="send" disabled>Send</button>

<script>
const logDiv = document.getElementById("log");
const msgInput = document.getElementById("msg");
const sendBtn = document.getElementById("send");

function log(message) {
  logDiv.innerHTML += message + "<br>";
  logDiv.scrollTop = logDiv.scrollHeight;
}

// 🌍 Your Render WebSocket Signaling Server
const ws = new WebSocket("wss://connection-zhjs.onrender.com");
  
ws.onopen = () => console.log("WS connected ✔");
ws.onerror = (e) => console.error("WS error ❌", e);
ws.onclose = () => console.log("WS closed");

// 🌐 WebRTC with public STUN (required for global connections)
let pc = new RTCPeerConnection({
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
});

let channel;

// Send signaling data to server
function signal(data) {
  ws.send(JSON.stringify(data));
}

// Receive signaling data from server
ws.onmessage = async event => {
  const data = JSON.parse(event.data);

  if (data.sdp) {
    await pc.setRemoteDescription(data.sdp);

    if (data.sdp.type === "offer") {
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      signal({ sdp: pc.localDescription });
    }
  }

  if (data.candidate) {
    try { await pc.addIceCandidate(data.candidate); } catch {}
  }
};

// Send ICE candidates to signaling server
pc.onicecandidate = event => {
  if (event.candidate) signal({ candidate: event.candidate });
};

// When receiving a WebRTC data channel
pc.ondatachannel = event => {
  channel = event.channel;
  setupChannel();
};

// Create a data channel automatically (one peer wins the race)
setTimeout(async () => {
  if (pc.connectionState !== "new") return;

  channel = pc.createDataChannel("chat");
  setupChannel();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  signal({ sdp: pc.localDescription });
}, Math.random() * 800);

// Setup the chat channel
function setupChannel() {
  channel.onopen = () => {
    log("Connected ✔");
    sendBtn.disabled = false;
  };

  channel.onmessage = e => log("Peer: " + e.data);

  channel.onclose = () => {
    log("Disconnected ❌");
    sendBtn.disabled = true;
  };
}

// Sending messages
sendBtn.onclick = () => {
  const text = msgInput.value;
  if (!text || channel.readyState !== "open") return;

  channel.send(text);
  log("You: " + text);
  msgInput.value = "";
};

// Enter key sends messages
msgInput.addEventListener("keydown", e => {
  if (e.key === "Enter") sendBtn.click();
});
</script>

</body>
</html>
